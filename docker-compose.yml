services:
  muse2api:
    build: .
    image: muse2api:latest
    # 从本地源码构建，避免尝试从 Docker Hub 拉取同名镜像
    pull_policy: build
    container_name: muse2api
    restart: always
    ports:
      - "${MUSE2API_PORT:-10002}:10002"
    environment:
      # 管理与 API 鉴权 Key（从 .env 或宿主环境读取，留空则自动生成）
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # 服务对外基准 URL，如 https://your-domain.com（留空则管理前端自动检测当前域名）
      - MUSE2API_PUBLIC_BASE=${MUSE2API_PUBLIC_BASE:-}
      # 容器内端口固定，对外端口由上面的 MUSE2API_PORT 控制
      - MUSE2API_PORT=10002
      # 超时配置（秒）
      - MUSE2API_IMAGE_TIMEOUT=${MUSE2API_IMAGE_TIMEOUT:-240}
      - MUSE2API_VIDEO_TIMEOUT=${MUSE2API_VIDEO_TIMEOUT:-600}
      - MUSE2API_CHAT_TIMEOUT=${MUSE2API_CHAT_TIMEOUT:-300}
      - MUSE2API_CONCURRENCY=${MUSE2API_CONCURRENCY:-2}
      - MUSE2API_KEEPALIVE_DISABLED_ACCOUNTS=${MUSE2API_KEEPALIVE_DISABLED_ACCOUNTS:-0}
      - MUSE2API_REF_IMAGE_LOCAL_FILES=${MUSE2API_REF_IMAGE_LOCAL_FILES:-0}
      - MUSE2API_REF_IMAGE_PRIVATE_FETCH=${MUSE2API_REF_IMAGE_PRIVATE_FETCH:-0}
    volumes:
      # 持久化账号配置、任务日志及媒体文件
      - ./data:/app/data
    shm_size: '2gb' # 保证 Chromium 渲染多标签页时不因 /dev/shm 耗尽崩溃
